# Example YOLO training dataset configuration
# Adapt UI element classes for your target social media platform

path: /app/data/datasets/social_ui  # Dataset root
train: train/images  # Train images
val: val/images  # Val images
test: test/images  # Test images (optional)

# Classes for social media UI elements (generic - customize per platform)
names:
  0: like_button
  1: follow_button
  2: comment_button
  3: video_player
  4: profile_icon
  5: share_button
  6: text_overlay
  7: thumbnail
  8: user_avatar